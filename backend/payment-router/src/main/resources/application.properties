# Name of this service. Shown in every log line and returned by GET /api/status.
spring.application.name=payment-router

# Port the embedded Tomcat server listens on.
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL connection
# ---------------------------------------------------------------------------
# JDBC URL format: jdbc:postgresql://<host>:<port>/<database>
# These values are for running the router locally (IDE or terminal) against a
# local PostgreSQL container published on host port 5433 (5433 avoids clashing
# with any other PostgreSQL already using the default port 5432).
# In Docker Compose they will be overridden by SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5433/payment_router
spring.datasource.username=router
spring.datasource.password=router

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# update = Hibernate creates or alters tables to match @Entity classes.
# There are no entities yet, so no tables are created.
spring.jpa.hibernate.ddl-auto=update

# Keep database sessions inside the service layer instead of the whole HTTP request.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Initial provider configuration (seed)
# ---------------------------------------------------------------------------
# Base URLs written to the providers table ONLY when a provider is inserted
# for the first time. After that, the router reads base_url from the database.
# Defaults are for local runs; Docker Compose sets DFSP_A_BASE_URL / DFSP_B_BASE_URL
# to the service names (http://dfsp-a:8081, http://dfsp-b:8082).
dfsp.a.base-url=${DFSP_A_BASE_URL:http://localhost:8081}
dfsp.b.base-url=${DFSP_B_BASE_URL:http://localhost:8082}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Write logs to a file as well as the console. The path is relative to the working
# directory: backend/payment-router/logs/ when run locally, /app/logs/ in Docker.
logging.file.name=logs/payment-router.log

# Start a new file after 10 MB and keep 7 days of old files.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# INFO and above for the router's own classes (quote, transfer, DFSP calls, errors).
logging.level.com.paymentrouter=INFO
