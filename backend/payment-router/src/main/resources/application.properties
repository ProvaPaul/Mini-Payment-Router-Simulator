# Name of this service. Shown in every log line and returned by GET /api/status.
spring.application.name=payment-router

# Port the embedded Tomcat server listens on.
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL connection
# ---------------------------------------------------------------------------
# JDBC URL format: jdbc:postgresql://<host>:<port>/<database>
# These values are for running the router locally (IDE or terminal) against a
# local PostgreSQL container published on host port 5433 (5433 avoids clashing
# with any other PostgreSQL already using the default port 5432).
# In Docker Compose they will be overridden by SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5433/payment_router
spring.datasource.username=router
spring.datasource.password=router

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# update = Hibernate creates or alters tables to match @Entity classes.
# There are no entities yet, so no tables are created.
spring.jpa.hibernate.ddl-auto=update

# Keep database sessions inside the service layer instead of the whole HTTP request.
spring.jpa.open-in-view=false
