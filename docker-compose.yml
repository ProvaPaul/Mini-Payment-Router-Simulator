# Mini Payment Router Simulator: all five services on one Docker network.
#
#   docker compose up --build        → open http://localhost:3000
#
# Services reach each other by service name (postgres, dfsp-a, dfsp-b, payment-router),
# never by localhost. Values like ${POSTGRES_PASSWORD:-router} can be overridden in a .env file.

name: mini-payment-router

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_router}
      POSTGRES_USER: ${POSTGRES_USER:-router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-router}
    volumes:
      # Named volume: data survives container removal and recreation.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: only containers on this network can reach the database.

  dfsp-a:
    build: ./backend/dfsp-a
    ports:
      - "8081:8081"

  dfsp-b:
    build: ./backend/dfsp-b
    ports:
      - "8082:8082"

  payment-router:
    build: ./backend/payment-router
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payment_router}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-router}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-router}
      # Written to the providers table when it is seeded for the first time.
      DFSP_A_BASE_URL: http://dfsp-a:8081
      DFSP_B_BASE_URL: http://dfsp-b:8082
    ports:
      - "8080:8080"
    volumes:
      # /app/logs/payment-router.log inside the container → ./logs/payment-router.log on the host.
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      dfsp-a:
        condition: service_started
      dfsp-b:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      payment-router:
        condition: service_healthy

volumes:
  pgdata:
