server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React single-page app: serve the file if it exists, otherwise index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the Payment Router container, addressed by its Docker Compose service name.
    location /api/ {
        proxy_pass http://payment-router:8080;

        # Keep the browser's Host header including the port (e.g. localhost:3000).
        # The browser sends Origin http://localhost:3000 on POST; the router must see a matching
        # Host, otherwise Spring treats the call as cross-origin and rejects it (403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
